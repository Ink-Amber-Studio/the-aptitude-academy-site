name: Build and publish TAA

on:
  push:
    branches: [main]
  schedule:
    # Decap publishes to the separate content repository. This protected
    # source repository polls it every 15 minutes without giving that editor
    # repository any deployment credential.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      verify_credentials:
        description: 'Run the read-only CMS and FTPS connection check (does not publish files).'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: taa-production-publish
  cancel-in-progress: false

jobs:
  build:
    name: Verify a releasable public output
    runs-on: ubuntu-latest
    steps:
      - name: Check out the protected website source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build a local-content release check
        run: |
          npm ci
          npm run package:launch

  verify-credentials:
    name: Verify protected CMS and FTPS access
    # This job can run only when manually requested with its explicit safe input.
    # It lists the restricted FTPS root; it never writes, deletes, or deploys.
    if: github.event_name == 'workflow_dispatch' && inputs.verify_credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check out the protected website source
        uses: actions/checkout@v4

      - name: Check out published CMS content read-only
        uses: actions/checkout@v4
        with:
          repository: Ink-Amber-Studio/the-aptitude-academy-content
          ref: main
          path: cms-content
          token: ${{ secrets.TAA_CONTENT_READ_TOKEN }}

      - name: Install the FTPS client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Identify the verified FTPS certificate name
        env:
          TAA_FTPS_SERVER: ${{ secrets.TAA_FTPS_SERVER }}
        run: |
          set -euo pipefail
          ftps_host="${TAA_FTPS_SERVER#ftp://}"
          ftps_host="${ftps_host%%:*}"
          openssl s_client -connect "${ftps_host}:21" -starttls ftp -servername "${ftps_host}" </dev/null 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName

      - name: Verify restricted FTPS root without publishing
        env:
          TAA_FTPS_SERVER: ${{ secrets.TAA_FTPS_SERVER }}
          TAA_FTPS_USERNAME: ${{ secrets.TAA_FTPS_USERNAME }}
          TAA_FTPS_PASSWORD: ${{ secrets.TAA_FTPS_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAA_FTPS_SERVER"
          test -n "$TAA_FTPS_USERNAME"
          test -n "$TAA_FTPS_PASSWORD"
          lftp -c "set cmd:fail-exit true; set net:max-retries 2; set net:timeout 30; set ssl:verify-certificate yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; open -u \"${TAA_FTPS_USERNAME}\",\"${TAA_FTPS_PASSWORD}\" \"${TAA_FTPS_SERVER}\"; cls; bye"

  publish:
    name: Publish protected source and CMS content
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the restricted publisher is enabled
        id: readiness
        env:
          TAA_PIPELINE_READY: ${{ secrets.TAA_PIPELINE_READY }}
        run: |
          if [ "$TAA_PIPELINE_READY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Publisher is intentionally disabled until its restricted credentials are installed."
          fi

      - name: Check out the protected website source
        if: steps.readiness.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Check out published CMS content only
        if: steps.readiness.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: Ink-Amber-Studio/the-aptitude-academy-content
          ref: main
          path: cms-content
          token: ${{ secrets.TAA_CONTENT_READ_TOKEN }}

      - name: Set up Node
        if: steps.readiness.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the crawlable public release package
        if: steps.readiness.outputs.enabled == 'true'
        env:
          TAA_CONTENT_ROOT: ${{ github.workspace }}/cms-content
        run: |
          npm ci
          npm run package:launch

      - name: Install the FTPS publisher
        if: steps.readiness.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Mirror the reviewed package to the cPanel document root
        if: steps.readiness.outputs.enabled == 'true'
        env:
          TAA_FTPS_SERVER: ${{ secrets.TAA_FTPS_SERVER }}
          TAA_FTPS_USERNAME: ${{ secrets.TAA_FTPS_USERNAME }}
          TAA_FTPS_PASSWORD: ${{ secrets.TAA_FTPS_PASSWORD }}
        run: |
          set -euo pipefail
          public_dir="$(find output -maxdepth 1 -type d -name 'public-*' -print -quit)"
          test -n "$public_dir"
          lftp -c "set cmd:fail-exit true; set net:max-retries 2; set net:timeout 30; set ssl:verify-certificate yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; open -u \"${TAA_FTPS_USERNAME}\",\"${TAA_FTPS_PASSWORD}\" \"${TAA_FTPS_SERVER}\"; mirror --reverse --delete --verbose \"${public_dir}\" /; bye"
