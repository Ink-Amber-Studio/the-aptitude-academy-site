name: Build and publish TAA

on:
  push:
    branches: [main]
  schedule:
    # A light hourly content-head check costs about 720 runner minutes/month,
    # rather than rebuilding and republishing 96 times per day. A cache keyed
    # to the published CMS commit prevents duplicate releases.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      verify_credentials:
        description: 'Run the read-only CMS and FTPS connection check (does not publish files).'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: taa-production-publish
  cancel-in-progress: false

jobs:
  detect-published-content:
    name: Check for newly published CMS content
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.decision.outputs.should_publish }}
      content_sha: ${{ steps.content-head.outputs.sha }}
    steps:
      - name: Read the published content head
        id: content-head
        env:
          TAA_CONTENT_READ_TOKEN: ${{ secrets.TAA_CONTENT_READ_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --retry 2 --retry-delay 2 --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${TAA_CONTENT_READ_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Ink-Amber-Studio/the-aptitude-academy-content/commits/main)"
          sha="$(printf '%s' "$response" | jq -r '.sha')"
          test "$sha" != "null"
          test "${#sha}" = 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Look up whether this CMS version is already live
        id: deployed-content
        uses: actions/cache/restore@v4
        with:
          path: .taa-deployed-content-marker
          key: taa-deployed-content-${{ steps.content-head.outputs.sha }}

      - name: Decide whether a release is required
        id: decision
        env:
          CACHE_HIT: ${{ steps.deployed-content.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Published CMS content is already live."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "A new published CMS version will be released."
          fi

  build:
    name: Verify a releasable public output
    needs: detect-published-content
    if: ${{ always() && (github.event_name != 'schedule' || needs.detect-published-content.outputs.should_publish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the protected website source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build a local-content release check
        run: |
          npm ci
          npm run package:launch

  verify-credentials:
    name: Verify protected CMS and FTPS access
    # This job can run only when manually requested with its explicit safe input.
    # It lists the restricted FTPS root; it never writes, deletes, or deploys.
    if: github.event_name == 'workflow_dispatch' && inputs.verify_credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check out the protected website source
        uses: actions/checkout@v4

      - name: Check out published CMS content read-only
        uses: actions/checkout@v4
        with:
          repository: Ink-Amber-Studio/the-aptitude-academy-content
          ref: main
          path: cms-content
          token: ${{ secrets.TAA_CONTENT_READ_TOKEN }}

      - name: Install the FTPS client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Verify restricted FTPS root without publishing
        env:
          TAA_FTPS_SERVER: ${{ secrets.TAA_FTPS_SERVER }}
          TAA_FTPS_USERNAME: ${{ secrets.TAA_FTPS_USERNAME }}
          TAA_FTPS_PASSWORD: ${{ secrets.TAA_FTPS_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAA_FTPS_SERVER"
          test -n "$TAA_FTPS_USERNAME"
          test -n "$TAA_FTPS_PASSWORD"
          lftp -c "set cmd:fail-exit true; set net:max-retries 2; set net:timeout 30; set ssl:verify-certificate yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; open -u \"${TAA_FTPS_USERNAME}\",\"${TAA_FTPS_PASSWORD}\" \"${TAA_FTPS_SERVER}\"; cls; bye"

  publish:
    name: Publish protected source and CMS content
    needs: build
    # A push has no CMS-head job, so evaluate this explicitly rather than
    # inheriting GitHub's default skip from that intentionally skipped job.
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the restricted publisher is enabled
        id: readiness
        env:
          TAA_PIPELINE_READY: ${{ secrets.TAA_PIPELINE_READY }}
        run: |
          if [ "$TAA_PIPELINE_READY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Publisher is intentionally disabled until its restricted credentials are installed."
          fi

      - name: Check out the protected website source
        if: steps.readiness.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Check out published CMS content only
        if: steps.readiness.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: Ink-Amber-Studio/the-aptitude-academy-content
          ref: main
          path: cms-content
          token: ${{ secrets.TAA_CONTENT_READ_TOKEN }}

      - name: Set up Node
        if: steps.readiness.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the crawlable public release package
        if: steps.readiness.outputs.enabled == 'true'
        env:
          TAA_CONTENT_ROOT: ${{ github.workspace }}/cms-content
        run: |
          npm ci
          npm run package:launch

      - name: Install the FTPS publisher
        if: steps.readiness.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Mirror the reviewed package to the cPanel document root
        if: steps.readiness.outputs.enabled == 'true'
        env:
          TAA_FTPS_SERVER: ${{ secrets.TAA_FTPS_SERVER }}
          TAA_FTPS_USERNAME: ${{ secrets.TAA_FTPS_USERNAME }}
          TAA_FTPS_PASSWORD: ${{ secrets.TAA_FTPS_PASSWORD }}
        run: |
          set -euo pipefail
          public_dir="$(find output -maxdepth 1 -type d -name 'public-*' -print -quit)"
          test -n "$public_dir"
          lftp -c "set cmd:fail-exit true; set net:max-retries 2; set net:timeout 30; set ssl:verify-certificate yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; open -u \"${TAA_FTPS_USERNAME}\",\"${TAA_FTPS_PASSWORD}\" \"${TAA_FTPS_SERVER}\"; mirror --reverse --delete --verbose \"${public_dir}\" /; bye"

      - name: Record the deployed CMS version
        if: github.event_name == 'schedule' && steps.readiness.outputs.enabled == 'true'
        run: |
          mkdir -p .taa-deployed-content-marker
          printf '%s\n' '${{ needs.detect-published-content.outputs.content_sha }}' > .taa-deployed-content-marker/content-sha.txt

      - name: Remember the deployed CMS version
        if: github.event_name == 'schedule' && steps.readiness.outputs.enabled == 'true'
        uses: actions/cache/save@v4
        with:
          path: .taa-deployed-content-marker
          key: taa-deployed-content-${{ needs.detect-published-content.outputs.content_sha }}
